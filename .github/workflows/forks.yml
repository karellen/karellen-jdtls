name: Build Forks

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  JDTLS_REPO: arcivanov/eclipse.jdt.ls
  JDTLS_BRANCH: feature/search-participant-extension-point

jobs:
  build-forks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout karellen-jdtls
        uses: actions/checkout@v6

      - name: Checkout eclipse.jdt.ls fork
        uses: actions/checkout@v6
        with:
          repository: ${{ env.JDTLS_REPO }}
          ref: ${{ env.JDTLS_BRANCH }}
          path: upstream/eclipse.jdt.ls

      - name: Checkout eclipse.jdt.javac
        uses: actions/checkout@v6
        with:
          repository: eclipse-jdtls/eclipse.jdt.javac
          ref: main
          path: upstream/eclipse.jdt.javac

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
          mvn-toolchain-id: JavaSE-25
          server-id: github

      - name: Cache Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-forks-${{ hashFiles('upstream/**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-forks-

      - name: Build eclipse.jdt.javac
        run: |
          sed -i '/<!-- Forked JDT Core test bundles/,/<\/repository>/d' upstream/eclipse.jdt.javac/pom.xml
          mvn -f upstream/eclipse.jdt.javac/pom.xml clean verify -DskipTests -B -q \
            -pl org.eclipse.jdt.core.javac,org.eclipse.jdt.core.javac.configurator,org.eclipse.jdt.javac.ui,org.eclipse.jdt.javac.feature,repository

      - name: Build jdtls fork
        run: |
          JAVAC_REPO="file://${{ github.workspace }}/upstream/eclipse.jdt.javac/repository/target/repository/"
          sed -i "s|https://ci.eclipse.org/ls/job/eclipse.jdt.javac/job/main/lastSuccessfulBuild/artifact/repository/target/repository/|${JAVAC_REPO}|" \
            upstream/eclipse.jdt.ls/org.eclipse.jdt.ls.target/org.eclipse.jdt.ls.tp.target
          mvn -f upstream/eclipse.jdt.ls/pom.xml clean install -DskipTests -B -q -pl '!org.eclipse.jdt.ls.product'

      - name: Save and publish fork m2 repository
        run: |
          set -eEuo pipefail
          cd ~/.m2/repository
          DIRS=""
          for d in org/eclipse/jdt org/eclipse/eclipse-platform-parent eclipse .meta .cache/tycho; do
            [ -d "$d" ] && DIRS="$DIRS $d"
          done
          tar czf "$OLDPWD/m2-forks.tar.gz" $DIRS
          cd "$OLDPWD"

          # Composite tag from fork versions
          JDTLS_VERSION=$(mvn -f upstream/eclipse.jdt.ls/pom.xml help:evaluate -Dexpression=project.version -q -DforceStdout)
          TAG="forks-jdtls-${JDTLS_VERSION}"

          gh release create "$TAG" --prerelease \
            --title "Forks: jdtls ${JDTLS_VERSION}" \
            --notes "Fork m2 repository snapshot" || true
          gh release upload "$TAG" m2-forks.tar.gz --clobber
          echo "Published fork m2 as release $TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy forks to GitHub Packages
        run: |
          mvn -f upstream/eclipse.jdt.ls/pom.xml deploy -DskipTests -B -pl '!org.eclipse.jdt.ls.product' \
            -DaltDeploymentRepository=github::https://maven.pkg.github.com/karellen/karellen-jdtls
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

